<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBR Simplified – ACCA SBR quick notes, quizzes and study planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f1;--card:#ffffff;--ink:#10251e;--muted:#54675f;--brand:#1d6b57;--brand-ink:#ffffff;
  --soft:#dcebe5;--red:#c8443a;--gold:#b7791f;--goldbg:#fbeecb;--redbg:#fbe0dd;--line:#d2ded8;
  --good:#166534;--goodbg:#d8f3e2;--bad:#9b2c2c;--badbg:#fbe0dd;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a16;--card:#15251f;--ink:#e6f1ec;--muted:#9db3aa;--brand:#4cc2a1;--brand-ink:#08211a;
    --soft:#1c3129;--red:#ff7b6f;--gold:#f0bb45;--goldbg:#33290f;--redbg:#3a1d1a;--line:#2a4238;
    --good:#7ee2a1;--goodbg:#173a26;--bad:#ff9a92;--badbg:#3a1d1a;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a16;--card:#15251f;--ink:#e6f1ec;--muted:#9db3aa;--brand:#4cc2a1;--brand-ink:#08211a;
  --soft:#1c3129;--red:#ff7b6f;--gold:#f0bb45;--goldbg:#33290f;--redbg:#3a1d1a;--line:#2a4238;
  --good:#7ee2a1;--goodbg:#173a26;--bad:#ff9a92;--badbg:#3a1d1a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;line-height:1.15;margin:0}
a{color:var(--brand)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-size:19px;white-space:nowrap}
.logo{background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:14px;padding:5px 8px;border-radius:6px;letter-spacing:.5px}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px;white-space:nowrap}
nav a.on{background:var(--soft);color:var(--brand)}
#theme{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;width:36px;height:36px;font-size:16px;cursor:pointer;flex:none}

main{padding-top:26px;padding-bottom:40px;min-height:70vh}
.ph{font-size:clamp(28px,5vw,40px);letter-spacing:-.5px}
.sub{color:var(--muted);margin:8px 0 20px;max-width:60ch}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding:14px 0 26px}
.hero h1{font-size:clamp(40px,8vw,68px);letter-spacing:-1.5px;font-weight:800}
.lead{font-size:18px;color:var(--muted);margin:14px 0 22px;max-width:46ch}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;background:var(--brand);color:var(--brand-ink);padding:12px 20px;border-radius:10px;font-weight:700;text-decoration:none;border:2px solid var(--brand);cursor:pointer;font:inherit;font-weight:700}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.sm{padding:8px 14px;font-size:14px}
.tacc{background:var(--card);border:1px solid var(--line);border-left:6px double var(--red);border-radius:12px;padding:18px 18px 16px;box-shadow:0 10px 30px rgba(16,37,30,.08)}
.tt{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;margin-bottom:12px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.tgrid>div{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.tgrid .tl{border-right:2px solid var(--ink)}
.tb{margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);font-weight:700;color:var(--brand)}
.tnote{font-size:12.5px;color:var(--muted);margin-top:6px}

.stats{display:flex;flex-wrap:wrap;gap:10px 28px;padding:14px 0 6px;border-top:1px solid var(--line);margin-top:6px;color:var(--muted)}
.stats b{color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-size:22px;margin-right:6px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin:22px 0}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-left:6px double var(--brand);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--brand)}
.tile h3{font-size:19px;margin-bottom:4px}
.tile p{margin:0;color:var(--muted);font-size:14.5px}
.strip{background:var(--redbg);border-left:6px double var(--red);padding:14px 18px;border-radius:10px;margin-top:8px}
.strip b{color:var(--red)}

/* standards list */
.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.list{display:grid;gap:9px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px 10px 10px;text-decoration:none;color:var(--ink)}
.row:hover{border-color:var(--brand)}
.tab{min-width:84px;text-align:center;background:var(--soft);color:var(--brand);font-family:"Bricolage Grotesque",sans-serif;font-weight:800;padding:9px 8px;border-radius:7px;border-right:3px solid var(--red);font-size:15px}
.rt{flex:1;display:flex;flex-direction:column;line-height:1.3}
.rt small{color:var(--muted)}
.tick{color:var(--good);font-weight:800;visibility:hidden}
.row.rev .tick{visibility:visible}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px}

/* standard page */
.back{display:inline-block;margin-bottom:14px;font-weight:600;text-decoration:none}
.shead{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.shead .tab{font-size:22px;padding:14px 16px;min-width:110px}
.badge{display:inline-block;background:var(--soft);color:var(--brand);padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-left:6px double var(--brand);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.card h2{font-size:21px;margin-bottom:10px}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.pts li{padding-left:22px;position:relative}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;background:var(--red);border-radius:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.pn a{text-decoration:none;font-weight:600}

/* quiz */
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.quiz h3{font-size:20px;margin:16px 0 12px;line-height:1.3}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.ok{background:var(--goodbg);border-color:var(--good);color:var(--good);font-weight:600}
.opt.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.tagq{display:inline-block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.fb{margin-top:14px;display:flex;justify-content:flex-end}
.result{text-align:center;padding:8px 0}
.result .big{font-family:"Bricolage Grotesque",sans-serif;font-size:56px;font-weight:800;color:var(--brand)}
.rev-list{text-align:left;margin:16px 0;display:grid;gap:8px}
.rev-list div{background:var(--badbg);border-radius:8px;padding:10px 12px;font-size:14.5px}
.rev-list b{display:block}

/* consolidation */
details{background:var(--card);border:1px solid var(--line);border-left:6px double var(--brand);border-radius:12px;margin-bottom:10px}
summary{cursor:pointer;padding:14px 18px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--red);font-size:22px;line-height:1}
details[open] summary::after{content:"\2212"}
details .pts{padding:0 18px 16px}
.formula{background:var(--card);border:1px solid var(--line);border-left:6px double var(--red);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.formula h3{font-size:18px;margin-bottom:8px}
.formula code{display:block;background:var(--soft);padding:10px 12px;border-radius:8px;margin:6px 0;font-size:14.5px;font-family:inherit;font-weight:600}

/* planner */
.ctl{display:flex;flex-wrap:wrap;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.ctl label{display:flex;flex-direction:column;font-size:13.5px;color:var(--muted);gap:4px;font-weight:600}
.ctl input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.prog .bar{flex:1;height:12px}
.prog span{font-weight:700;font-size:14px;min-width:96px;text-align:right}
.wk{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;margin:24px 0 10px}
.wk.rv{color:var(--red);border-top:3px double var(--red);padding-top:14px}
.wk small{display:block;font-family:"Figtree",sans-serif;font-size:14px;color:var(--muted);font-weight:500}
.day{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;align-items:flex-start}
.day input{width:22px;height:22px;margin-top:3px;accent-color:var(--brand);flex:none}
.day.done{opacity:.6}
.day.done .dc strong{text-decoration:line-through}
.day.today{border:2px solid var(--gold)}
.dn{min-width:74px;display:flex;flex-direction:column;line-height:1.25}
.dn small{color:var(--muted)}
.dc{flex:1;display:flex;flex-direction:column;gap:3px}
.pb{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-right:6px}
.pb.L{background:var(--soft);color:var(--brand)}
.pb.C{background:var(--goldbg);color:var(--gold)}
.pb.R{background:var(--redbg);color:var(--red)}
.pb.P{background:var(--ink);color:var(--bg)}
.txt{color:var(--muted);font-size:14.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tags a{font-size:12.5px;font-weight:700;background:var(--soft);padding:2px 9px;border-radius:6px;text-decoration:none}
.now{background:var(--gold);color:#fff;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px}

.foot{border-top:1px solid var(--line);padding-top:18px;padding-bottom:30px;color:var(--muted);font-size:14px}
.tip{background:var(--goldbg);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:14.5px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .topin{flex-wrap:wrap}
  nav{order:3;flex-basis:100%}
  .brand{font-size:17px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topin">
    <a class="brand" href="#/home"><span class="logo">SBR</span><b>Simplified</b></a>
    <nav id="nav" aria-label="Main"></nav>
    <button id="theme" aria-label="Switch light or dark mode" title="Light / dark">&#9680;</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap foot">SBR Simplified is a free study aid by Hisham Rahman, ACCA finalist. Always confirm details against the official ACCA syllabus, examinable documents and IFRS text.</footer>

<script>
/* ---------- helpers ---------- */
var mem={};
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){} return (k in mem)?mem[k]:d},
  set:function(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function sid(c){return c.replace(/[^A-Za-z0-9]/g,"")}
var app=document.getElementById("app");

/* ---------- STANDARDS DATA ----------
   [code, name, type, group, [key points], [[question, correct, wrong, wrong], ...]] */
var S=[
["CF","Conceptual Framework","Other","Framework",[
 "Objective: useful information to investors, lenders and other creditors (primary users).",
 "Fundamental characteristics: relevance (predictive/confirmatory value, materiality) and faithful representation (complete, neutral, free from error).",
 "Enhancing characteristics: comparability, verifiability, timeliness, understandability.",
 "Asset = present economic resource controlled as a result of past events. Liability = present obligation to transfer an economic resource as a result of past events.",
 "Equity = residual interest. Income and expenses = changes in assets/liabilities other than equity contributions/distributions.",
 "Recognise if relevant and faithfully represented; derecognise when control lost (asset) or obligation ends (liability).",
 "Measurement: historical cost or current value (fair value, value in use, current cost).",
 "Profit or loss is the default; OCI only when it improves relevance or faithful representation; recycling normally expected."],
 [["Which is a fundamental qualitative characteristic?","Relevance","Timeliness","Comparability"],
  ["A liability is best defined as a...","Present obligation to transfer an economic resource","Possible future payment","Any expected cash outflow"]]],

["IFRS 15","Revenue from Contracts with Customers","IFRS","Revenue",[
 "Five steps: 1 identify contract, 2 identify performance obligations (POs), 3 transaction price, 4 allocate to POs, 5 recognise revenue when/as PO satisfied.",
 "Allocate price by relative stand-alone selling prices.",
 "Over time if: customer consumes benefit as you perform, OR customer controls the asset as it is created, OR no alternative use + enforceable right to payment. Otherwise point in time (control passes).",
 "Variable consideration: expected value or most likely amount, constrained so a significant reversal is highly unlikely.",
 "Significant financing component: adjust for time value (practical expedient if gap 1 year or less).",
 "Principal (controls goods first, records gross) vs agent (records net commission).",
 "Costs to obtain a contract (incremental) and to fulfil: capitalise if recoverable; amortise.",
 "Warranties: assurance-type = IAS 37; service-type = separate PO. Licence: right to access = over time; right to use = point in time.",
 "Contract modification: separate contract if distinct goods added at stand-alone price."],
 [["Step 4 of IFRS 15 is to...","Allocate the transaction price to performance obligations","Identify the contract","Recognise revenue"],
  ["An agent recognises revenue as...","Net commission","Full sales value","Cost of goods sold"]]],

["IAS 2","Inventories","IAS","Assets",[
 "Measure at the lower of cost and net realisable value (NRV).",
 "Cost = purchase + conversion + other costs to bring to present location and condition.",
 "Exclude abnormal waste, storage (unless necessary), admin and selling costs.",
 "Cost formulas: FIFO or weighted average. LIFO is banned.",
 "Write down to NRV item by item; reverse (up to original cost) if NRV recovers.",
 "Overhead absorption uses normal capacity."],
 [["Which cost formula is NOT permitted?","LIFO","FIFO","Weighted average"],
  ["Inventory is measured at the lower of cost and...","Net realisable value","Replacement cost","Selling price"]]],

["IAS 16","Property, Plant and Equipment","IAS","Assets",[
 "Initial cost = purchase price + directly attributable costs + estimated dismantling/restoration cost.",
 "Cost model or revaluation model (applied to the whole class, revalue regularly).",
 "Depreciate by component over useful life; review residual value and life at least annually.",
 "Revaluation gain to OCI (revaluation surplus) unless it reverses a previous loss in P&L. Loss first reduces surplus, then P&L.",
 "Transfer excess depreciation from surplus to retained earnings (permitted).",
 "Proceeds from selling items produced before the asset is ready go to P&L, not deducted from cost.",
 "Subsequent costs capitalised only if future benefits improve; repairs expensed."],
 [["A revaluation increase is normally recognised in...","OCI (revaluation surplus)","Profit or loss","Retained earnings directly"],
  ["Dismantling costs at initial recognition are...","Included in cost of the asset","Expensed immediately","Ignored until they occur"]]],

["IAS 20","Government Grants","IAS","Assets",[
 "Recognise only when reasonable assurance that conditions will be met and the grant received.",
 "Income approach: recognise in P&L over the periods the related costs are expensed.",
 "Asset-related grants: deduct from asset carrying amount OR show as deferred income.",
 "Non-monetary grants: at fair value or nominal amount.",
 "Repayment is a change in estimate."],
 [["Grants are recognised when there is...","Reasonable assurance of compliance and receipt","A grant application","Cash received only"],
  ["A grant for an asset may be shown as...","Deferred income or a deduction from cost","Equity reserve","Revenue immediately"]]],

["IAS 23","Borrowing Costs","IAS","Assets",[
 "Capitalise borrowing costs on qualifying assets (take a substantial time to get ready).",
 "Specific loans: actual interest less investment income on temporary surplus.",
 "General loans: weighted average capitalisation rate on expenditure.",
 "Start: expenditure incurred, borrowing costs incurred and activities under way.",
 "Suspend during extended interruptions; stop when substantially ready."],
 [["For general borrowings, capitalise using...","A weighted average capitalisation rate","The lowest interest rate","Base rate"],
  ["Capitalisation ends when the asset is...","Substantially ready for use or sale","Fully paid for","Insured"]]],

["IAS 36","Impairment of Assets","IAS","Assets",[
 "Impaired if carrying amount exceeds recoverable amount = higher of fair value less costs of disposal and value in use.",
 "Test annually: goodwill, indefinite-life intangibles, intangibles not yet in use. Others when indicators exist.",
 "Cash-generating unit (CGU): smallest group generating independent cash inflows; goodwill allocated to CGUs.",
 "Allocate impairment loss: goodwill first, then other assets pro rata (not below highest of FVLCD, VIU or zero).",
 "Reversals allowed (up to what carrying amount would have been) but NEVER for goodwill.",
 "Partly-owned subsidiary with proportionate NCI: gross up goodwill for testing; the loss recognised is the parent's share only."],
 [["Recoverable amount is the higher of...","Fair value less costs of disposal and value in use","Cost and NRV","Carrying amount and cost"],
  ["An impairment loss on goodwill...","Cannot be reversed","Can be reversed within 3 years","Is reversed if value recovers"]]],

["IAS 38","Intangible Assets","IAS","Assets",[
 "Recognise if identifiable, controlled and expected to give future benefits, and cost is measurable.",
 "Research: expense. Development: capitalise once all six are shown: probable benefits, intention to complete, resources, ability to use/sell, technical feasibility, reliable measurement (PIRATE).",
 "Never recognise internally generated goodwill, brands, mastheads, customer lists; also start-up, training, advertising.",
 "Cost model or revaluation model (only if an active market exists).",
 "Finite life: amortise. Indefinite life: no amortisation, annual impairment test.",
 "Acquired in a business combination: recognise separately at fair value."],
 [["Research expenditure is...","Expensed","Capitalised","Deferred"],
  ["An internally generated brand is...","Not recognised","Recognised at fair value","Recognised at cost"]]],

["IAS 40","Investment Property","IAS","Assets",[
 "Property held to earn rentals or for capital appreciation (not own use, not for sale in ordinary course).",
 "Choose cost model or fair value model (apply to all investment property).",
 "Fair value model: gains and losses in P&L; no depreciation.",
 "Mixed use: separate if parts can be sold separately; otherwise investment property only if own use is insignificant.",
 "Property rented to a group member is owner-occupied (IAS 16) in the consolidated accounts.",
 "Transfers only when there is evidence of change in use."],
 [["Under the fair value model, gains go to...","Profit or loss","OCI","Reserves"],
  ["Property leased to a subsidiary is, in group accounts...","Owner-occupied PPE","Investment property","Inventory"]]],

["IAS 41","Agriculture","IAS","Assets",[
 "Biological assets: fair value less costs to sell, changes in P&L.",
 "Agricultural produce: fair value less costs to sell at harvest; then IAS 2 inventory.",
 "Bearer plants (e.g. fruit trees) are treated under IAS 16, not IAS 41.",
 "Unconditional grants on biological assets: income when receivable."],
 [["Biological assets are measured at...","Fair value less costs to sell","Cost","Depreciated cost"],
  ["Bearer plants are accounted for under...","IAS 16","IAS 41","IAS 2"]]],

["IFRS 5","Non-current Assets Held for Sale","IFRS","Assets",[
 "Held for sale if carrying amount will be recovered mainly through sale, available now, and sale is highly probable (management committed, actively marketed, expected within 12 months).",
 "Measure at lower of carrying amount and fair value less costs to sell. Stop depreciation.",
 "Present separately; do not offset assets and liabilities.",
 "Discontinued operation: separate major line of business or geographic area, disposed or held for sale.",
 "Show one amount in P&L for discontinued ops and restate comparatives.",
 "Subsidiary to be sold with loss of control: classify all its assets and liabilities as held for sale."],
 [["Held-for-sale assets are measured at...","Lower of carrying amount and FV less costs to sell","Fair value","Cost"],
  ["Once held for sale, depreciation...","Stops","Continues","Doubles"]]],

["IFRS 16","Leases","IFRS","Assets",[
 "Lessee: one model. Recognise right-of-use (RoU) asset and lease liability. Exemptions: short-term (12 months or less) and low-value assets (expense).",
 "Lease liability = PV of future payments at rate implicit in the lease, else incremental borrowing rate.",
 "RoU asset = liability + payments made at/before start + initial direct costs + restoration cost - incentives.",
 "Depreciate RoU over the shorter of lease term and useful life. Interest on liability at effective rate.",
 "Variable payments linked to an index/rate are included; other variable payments are expensed.",
 "Lessor: finance lease (derecognise asset, recognise receivable) or operating lease (keep asset, rental income).",

/* ---------- QUIZ ENGINE ---------- */
function toQ(a,tag){return {q:a[0],c:a[1],w:a.slice(2),tag:tag||""}}
function runQuiz(box,qs,title){
  var i=0,score=0,wrong=[];
  function show(){
    if(i>=qs.length){return finish()}
    var it=qs[i],opts=shuffle([it.c].concat(it.w));
    box.innerHTML='<div class="qhead"><span>Question '+(i+1)+' of '+qs.length+'</span><span>Score '+score+'</span></div>'+
      '<div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div>'+
      '<h3>'+(it.tag?'<span class="tagq">'+esc(it.tag)+'</span><br>':'')+esc(it.q)+'</h3>'+
      '<div class="opts">'+opts.map(function(o){return '<button class="opt">'+esc(o)+'</button>'}).join("")+'</div><div class="fb" id="fb"></div>';
    var btns=box.querySelectorAll(".opt");
    Array.prototype.forEach.call(btns,function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(btns,function(x){x.disabled=true;if(x.textContent===it.c)x.classList.add("ok")});
        if(b.textContent===it.c){score++}else{b.classList.add("no");wrong.push(it)}
        var fb=box.querySelector("#fb");
        fb.innerHTML='<button class="btn sm" id="nx">'+(i+1>=qs.length?"See result":"Next question")+'</button>';
        box.querySelector("#nx").onclick=function(){i++;show()};
        box.querySelector("#nx").focus();
      };
    });
  }
  function finish(){
    var pct=Math.round(score/qs.length*100);
    var msg=pct>=80?"Excellent. You are exam-ready on this set.":pct>=50?"Good progress. Review the missed points below.":"Keep going. Re-read the summary and try again.";
    box.innerHTML='<div class="result"><div class="big">'+score+' / '+qs.length+'</div><p><b>'+pct+'%</b> - '+msg+'</p>'+
      (wrong.length?'<div class="rev-list">'+wrong.map(function(w){return '<div><b>'+esc(w.q)+'</b>Answer: '+esc(w.c)+'</div>'}).join("")+'</div>':'')+
      '<button class="btn" id="again">Try again</button></div>';
    box.querySelector("#again").onclick=function(){i=0;score=0;wrong=[];qs=shuffle(qs);show()};
  }
  show();
}

function standards(){

function std(id){
  var idx=-1;S.forEach(function(s,i){if(sid(s[0])===id)idx=i});

  var s=S[idx],rev=store.get("sbr_rev",{});

  app.innerHTML='<a class="back" href="#/standards">&larr; All standards</a>'+
   '<div class="shead"><span class="tab">'+esc(s[0])+'</span><div><h1 class="ph" style="font-size:clamp(24px,4.5vw,34px)">'+esc(s[1])+'</h1><span class="badge">'+esc(s[3])+'</span></div></div>'+

function consolidation(){
  app.innerHTML='<h1 class="ph">Consolidation</h1><p class="sub">Group accounting reminders for SBR: IFRS 3, IFRS 10, IAS 28, IAS 21, IAS 7 and IAS 36 in group context. Tap a heading to open it.</p>'+
   '<div class="formula"><h3>Formulas to remember</h3>'+
   '<code>Goodwill = Consideration + NCI + Previous interest at FV - FV of net assets</code>'+
   '<code>NCI = NCI at acquisition + NCI% x post-acq change in net assets - NCI share of impairment</code>'+
   '<code>Group RE = Parent RE + Parent% x subsidiary post-acq profit - parent share of impairment - parent share of PUP</code>'+

   CONS.map(function(c,i){return '<details'+(i===0?" open":"")+'><summary>'+esc(c[0])+'</summary><ul class="pts">'+c[1].map(function(p){return '<li>'+esc(p)+'</li>'}).join("")+'</ul></details>'}).join("")+

var QF={f:"All",n:10};
function pool(f){
  var a=[];
  if(f==="All"||f==="Consolidation"){CQ.forEach(function(q){a.push(toQ(q,"Consolidation"))})}
  if(f!=="Consolidation"){S.forEach(function(s){if(f==="All"||s[2]===f){s[5].forEach(function(q){a.push(toQ(q,s[0]))})}})}

}

  app.innerHTML='<h1 class="ph">Quiz</h1><p class="sub">Choose a set and test yourself. Every set is shuffled each time.</p>'+

  function draw(){
    document.getElementById("fc").innerHTML=["All","IFRS","IAS","Other","Consolidation"].map(function(f){return '<button class="chip'+(QF.f===f?" on":"")+'" data-f="'+f+'">'+(f==="All"?"All topics":f==="Other"?"Framework and ethics":f)+'</button>'}).join("");

    Array.prototype.forEach.call(document.querySelectorAll("#nc .chip"),function(b){b.onclick=function(){QF.n=+b.getAttribute("data-n");draw()}});

}

function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmt(d){return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]}
function getStart(){return store.get("sbr_start",iso(new Date()))}
function tagLinks(c){return c.length?'<span class="tags">'+c.map(function(x){return x==="CONS"?'<a href="#/consolidation">Consolidation</a>':'<a href="#/s/'+sid(x)+'">'+esc(x)+'</a>'}).join("")+'</span>':""}

function planPage(kind){
  var key=kind==="study"?"sbr_study":"sbr_lect";
  var st=parse(getStart()),done=store.get(key,{}),today=iso(new Date());
  var title=kind==="study"?"60-day study planner":"Lecture watching planner";
  var sub=kind==="study"?"45 days of learning, then the last 15 days for revision and mocks. Tick each day when done.":"Which lecture to watch each day, with catch-up days and a final revision sprint. Tick each day when done.";
  var html='<h1 class="ph">'+title+'</h1><p class="sub">'+sub+'</p>'+
   '<div class="ctl"><label>Start date<input type="date" id="sd" value="'+getStart()+'"></label><label>Or set exam date (plan counts back)<input type="date" id="ed" value="'+store.get("sbr_exam","")+'"></label></div>'+
   '<div class="prog"><div class="bar"><i id="pb"></i></div><span id="pt"></span></div>';
  if(kind==="lect")html+='<div class="tip">Tip: take the quiz on each standard page right after the lecture. It locks the knowledge in while it is fresh.</div>';
  PLAN.forEach(function(d,i){
    if(i<45&&i%7===0)html+='<h2 class="wk">Week '+(i/7+1)+'</h2>';
    if(i===45)html+='<h2 class="wk rv">Last 15 days: revision sprint<small>'+fmt(addDays(st,45))+' to '+fmt(addDays(st,59))+'</small></h2>';
    var dt=addDays(st,i),isT=iso(dt)===today;
    var text=kind==="study"?TASK[d[0]]:LEC[d[0]];
    var head=kind==="study"?d[1]:(d[0]==="L"?"Lecture: ":d[0]==="R"?"Rewatch: ":"")+d[1];
    html+='<label class="day'+(done[i]?" done":"")+(isT?" today":"")+'"><input type="checkbox" data-i="'+i+'"'+(done[i]?" checked":"")+'>'+
     '<span class="dn"><b>Day '+(i+1)+'</b><small>'+fmt(dt)+'</small></span>'+
     '<span class="dc"><span><span class="pb '+d[0]+'">'+PL[d[0]]+'</span>'+(isT?'<span class="now">Today</span>':'')+'</span><strong>'+esc(head)+'</strong><span class="txt">'+esc(text)+'</span>'+tagLinks(d[2])+'</span></label>';
  });
  app.innerHTML=html;
  function prog(){
    var n=0;for(var k in done){if(done[k])n++}
    document.getElementById("pb").style.width=(n/PLAN.length*100)+"%";
    document.getElementById("pt").textContent=n+" of "+PLAN.length+" days";
  }
  prog();
  Array.prototype.forEach.call(app.querySelectorAll(".day input"),function(c){
    c.onchange=function(){
      var i=c.getAttribute("data-i");
      if(c.checked)done[i]=true;else delete done[i];
      store.set(key,done);c.parentNode.classList.toggle("done",c.checked);prog();
    };
  });
  document.getElementById("sd").onchange=function(e){if(e.target.value){store.set("sbr_start",e.target.value);store.set("sbr_exam","");planPage(kind)}};
  document.getElementById("ed").onchange=function(e){
    if(e.target.value){store.set("sbr_exam",e.target.value);store.set("sbr_start",iso(addDays(parse(e.target.value),-59)));planPage(kind)}
  };
  var t=app.querySelector(".day.today");if(t&&t.getBoundingClientRect().top>window.innerHeight)t.scrollIntoView({block:"center"});
}
